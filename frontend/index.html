    const CHAT_STORAGE_KEY = 'jh_chat_history';
    const CHAT_MAX_SAVED = 60;

    const CHAT_MAX_IMAGES = 4;

    const chat = {
      messages: loadChatHistory(),  // [{role, content, images?: [缩略图], actions?: [{ok, summary}]}]
      job: null,                    // 当前围绕的岗位 {id, company, title}
      controller: null,             // 正在进行的请求，用于「停止」
      pending: [],                  // 待发送的图片 [{full: 发给 AI 的压缩图, thumb: 缩略图}]
    };

    function loadChatHistory() {
      try {
        const data = JSON.parse(localStorage.getItem(CHAT_STORAGE_KEY) || '[]');
        return Array.isArray(data) ? data : [];
      } catch (e) {
        return [];
      }
    }

    /** 缩略图比较占空间，存满时从最早的消息开始丢掉缩略图 */
    function saveChatHistory() {
      const saved = chat.messages.slice(-CHAT_MAX_SAVED).map((m) => ({ ...m }));
      for (let i = 0; ; i++) {
        try {
          localStorage.setItem(CHAT_STORAGE_KEY, JSON.stringify(saved));
          return;
        } catch (e) {
          while (i < saved.length && !(saved[i].images && saved[i].images.length)) i++;
          if (i >= saved.length) return;
          saved[i].images = [];
        }
      }
    }

    // 网址：带 http(s):// 或 www. 的，以及 AI 常写的不带协议的域名（shoplazza.cn/pages/join-us）
    const URL_RE = /(^|[^\w@\/.-])((?:https?:\/\/|www\.)[^\s<>"'`，。；！？、（）()]+|(?:[a-z0-9-]+\.)+(?:com\.cn|com|cn|net|org|io|ai|co|tech|jobs|work)(?![a-z0-9-])(?:\/[^\s<>"'`，。；！？、（）()]*)?)/gi;

    /** 把已转义文本里的 Markdown 链接和网址变成可点击的链接 */
    function linkify(html) {
      const links = [];
      const keep = (a) => `\u0000${links.push(a) - 1}\u0000`;
      const anchor = (url, text) =>
        `<a href="${/^https?:\/\//i.test(url) ? url : 'https://' + url}" target="_blank" rel="noopener">${text}</a>`;
      return html
        .replace(/\[([^\]\n]+)\]\(((?:https?:\/\/)?[^\s)]+)\)/g, (m, text, url) => keep(anchor(url, text)))
        .replace(URL_RE, (m, pre, url) => {
          const trail = (url.match(/(?:&gt;|&quot;|&#39;|[.,;:!?])+$/) || [''])[0];
          const clean = url.slice(0, url.length - trail.length);
          return pre + keep(anchor(clean, clean)) + trail;
        })
        .replace(/\u0000(\d+)\u0000/g, (m, i) => links[i]);
    }

    /** 行内 Markdown：代码、加粗、链接（输入已转义） */
    function mdInline(s) {
      return linkify(s
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>'));
    }

    /** 轻量 Markdown 渲染：标题、列表、代码块、段落；先整体转义，保证安全 */
    function renderMarkdown(src) {
      const codeBlocks = [];
      const text = esc(src).replace(/```[\w-]*\n?([\s\S]*?)(?:```|$)/g, (m, code) => {
        codeBlocks.push(code.replace(/\n$/, ''));
        return `\n@@CODE${codeBlocks.length - 1}@@\n`;
      });

      const out = [];
      let list = null;
      const closeList = () => { if (list) { out.push(`</${list}>`); list = null; } };

      for (const raw of text.split('\n')) {
        const line = raw.trimEnd();
        let m;
        if ((m = line.match(/^@@CODE(\d+)@@$/))) {
          closeList();
          out.push(`<pre><code>${codeBlocks[m[1]]}</code></pre>`);
        } else if ((m = line.match(/^#{1,4}\s+(.*)/))) {
          closeList();
          out.push(`<h4>${mdInline(m[1])}</h4>`);
        } else if ((m = line.match(/^\s*[-*•]\s+(.*)/))) {
          if (list !== 'ul') { closeList(); out.push('<ul>'); list = 'ul'; }
          out.push(`<li>${mdInline(m[1])}</li>`);
        } else if ((m = line.match(/^\s*(\d+)[.)、](?!\d)\s*(.*)/))) {
          // 编号列表被子列表打断后，用 start 保留原编号
          if (list !== 'ol') { closeList(); out.push(`<ol start="${m[1]}">`); list = 'ol'; }
          out.push(`<li>${mdInline(m[2])}</li>`);
        } else if (line.trim()) {
          closeList();
          out.push(`<p>${mdInline(line)}</p>`);
        }
      }
      closeList();
      return out.join('');
    }

    /** 根据是否围绕岗位给出不同的快捷问题 */
    function chatSuggestions() {
      if (chat.job) {
        return ['这个岗位值得投吗？', '针对这个岗位写一段打招呼语', '这个岗位面试可能问什么？', '把这个岗位标记为待投递'];
      }
      return ['今天应该优先投哪几个？', '把 70 分以上的岗位标记为待投递', '我的简历有哪些短板？', '模拟一轮电商运营面试'];
    }

    /** 助手消息主体：先展示执行过的操作卡片，再展示回复文字 */
    function assistantBody(m) {
      const actionsHtml = (m.actions || []).map((a) =>
        `<div class="action-card ${a.ok ? 'ok' : 'fail'}">${a.ok ? '✅' : '⚠️'} ${esc(a.summary)}</div>`
      ).join('');
      const typing = '<span class="typing"><i></i><i></i><i></i></span>';
      const text = m.content ? renderMarkdown(m.content) : (m.actions && m.actions.length && !chat.controller ? '' : typing);
      return actionsHtml + text;
    }

    /** 发给后端的历史：把执行过的操作附在文字后面，让 AI 知道之前做过什么；以前发过的图片只留个说明 */
    function historyForApi(messages) {
      return messages.map((m) => {
        const actionLines = (m.actions || []).map((a) => `[已执行操作] ${a.ok ? '' : '（失败）'}${a.summary}`);
        const imageNote = m.images && m.images.length ? `[当时附了 ${m.images.length} 张图片，已看过]` : '';
        const content = [m.content, imageNote, ...actionLines].filter(Boolean).join('\n');
        return { role: m.role, content };
      }).filter((m) => m.content);
    }

    function renderChat() {
      const box = $('chatMessages');
      if (!chat.messages.length) {
        box.innerHTML = `
          <div class="chat-welcome">
            你好！我是你的 <b>AI 求职顾问</b>，已经看过你的简历、求职偏好和岗位库。<br>
            可以问我投递优先级、岗位分析、打招呼语、模拟面试等任何求职问题。<br>
            也可以直接让我动手，比如「把小米的岗位都标记为拒绝」「目标城市加上广州」。<br>
            在岗位详情页点「💬 问 AI」，我会结合那个岗位的完整 JD 回答。
          </div>`;
      } else {
        box.innerHTML = chat.messages.map((m, i) => {
          if (m.role === 'user') {
            const pics = (m.images || []).filter((src) => /^data:image\//.test(src));
            const imagesHtml = pics.length
              ? `<div class="msg-images">${pics.map((src) => `<img src="${esc(src)}" alt="图片">`).join('')}</div>` : '';
            const bubble = m.content ? `<div class="bubble">${esc(m.content)}</div>` : '';
            return `<div class="msg user">${imagesHtml}${bubble}</div>`;
          }
          const streaming = chat.controller && i === chat.messages.length - 1;
          const tools = streaming || !m.content ? '' :
            `<div class="msg-tools"><button data-copy="${i}">复制</button></div>`;
          return `<div class="msg assistant"><div class="bubble">${assistantBody(m)}</div>${tools}</div>`;
        }).join('');
      }
      box.scrollTop = box.scrollHeight;

      // 上下文条与快捷问题
      $('chatContext').classList.toggle('show', !!chat.job);
      if (chat.job) $('chatContextText').textContent = `📌 围绕岗位：#${chat.job.id} ${chat.job.company} · ${chat.job.title}`;
      $('chatSuggestions').innerHTML = chat.controller ? '' :
        chatSuggestions().map((q) => `<button type="button">${esc(q)}</button>`).join('');
    }

    /** 流式输出过程中只更新最后一条消息，避免整体重绘导致闪烁 */
    function updateLastAssistant() {
      const box = $('chatMessages');
      const bubbles = box.querySelectorAll('.msg.assistant .bubble');
      const last = bubbles[bubbles.length - 1];
      const msg = chat.messages[chat.messages.length - 1];
      if (!last || !msg) return;
      const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
      last.innerHTML = assistantBody(msg);
      if (nearBottom) box.scrollTop = box.scrollHeight;
    }

    function setChatBusy(busy) {
      const btn = $('chatSendBtn');
      btn.textContent = busy ? '停止' : '发送';
      btn.classList.toggle('primary', !busy);
    }

    async function sendChat(text, images = []) {
      const content = (text || '').trim();
      if ((!content && !images.length) || chat.controller) return;

      chat.messages.push(images.length ? { role: 'user', content, images: images.map((p) => p.thumb) } : { role: 'user', content });
      const reply = { role: 'assistant', content: '', actions: [] };
      chat.messages.push(reply);
      chat.controller = new AbortController();
      setChatBusy(true);
      renderChat();

      // 处理后端推送的单个事件
      let textAfterAction = false;
      const handleEvent = (evt) => {
        if (evt.type === 'text') {
          // 操作之后的文字与之前的文字分段显示
          if (textAfterAction && reply.content) reply.content += '\n\n';
          textAfterAction = false;
          reply.content += evt.content;
        } else if (evt.type === 'action') {
          reply.actions.push({ ok: evt.ok, summary: evt.summary });
          textAfterAction = true;
          if (evt.refresh) {
            refreshAll();
            if (state.currentJobId) openDetail(state.currentJobId);
          }
        } else if (evt.type === 'error') {
          reply.content += `${reply.content ? '\n\n' : ''}⚠️ ${evt.message}`;
        }
        updateLastAssistant();
      };

      try {
        const history = historyForApi(chat.messages.slice(0, -1)).slice(-20);
        if (images.length) history[history.length - 1] = { role: 'user', content, images: images.map((p) => p.full) };
        const resp = await fetch(API + '/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: history, job_id: chat.job ? chat.job.id : null }),
          signal: chat.controller.signal,
        });
        if (!resp.ok) {
          const data = await resp.json().catch(() => null);
          throw new Error((data && data.detail) || `请求失败（HTTP ${resp.status}）`);
        }
        // 响应为 NDJSON：每行一个 JSON 事件
        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        while (true) {
          const { done, value } = await reader.read();
          buffer += done ? decoder.decode() : decoder.decode(value, { stream: true });
          let idx;
          while ((idx = buffer.indexOf('\n')) >= 0) {
            const line = buffer.slice(0, idx).trim();
            buffer = buffer.slice(idx + 1);
            if (line) handleEvent(JSON.parse(line));
          }
          if (done) break;
        }
        if (buffer.trim()) handleEvent(JSON.parse(buffer));
      } catch (e) {
        if (e.name === 'AbortError') {
          reply.content += reply.content ? '\n\n（已停止生成）' : '（已停止生成）';
        } else {
          const msg = e instanceof TypeError ? '无法连接后端服务，请确认已启动' : e.message;
          reply.content += `${reply.content ? '\n\n' : ''}⚠️ ${msg}`;
        }
      } finally {
        chat.controller = null;
        if (!reply.content && !reply.actions.length) reply.content = '（没有收到回复，请重试）';
        setChatBusy(false);
        saveChatHistory();
        renderChat();
      }
    }

    /** 打开聊天窗口；传入岗位时围绕该岗位对话 */
    function openChat(job) {
      if (job) chat.job = { id: job.id, company: job.company || '未知公司', title: job.title || '' };
      $('chatPanel').classList.add('show');
      $('chatPanel').setAttribute('aria-hidden', 'false');
      $('chatLauncher').classList.add('hidden');
      renderChat();
      setTimeout(() => $('chatInput').focus(), 50);
    }

    function closeChat() {
      $('chatPanel').classList.remove('show');
      $('chatPanel').setAttribute('aria-hidden', 'true');
      $('chatLauncher').classList.remove('hidden');
    }

    /** 输入框高度随内容自适应 */
    function autosizeChatInput() {
      const el = $('chatInput');
      el.style.height = 'auto';
      el.style.height = `${Math.min(el.scrollHeight, 140)}px`;
    }

    $('chatLauncher').addEventListener('click', () => openChat());
    $('chatCloseBtn').addEventListener('click', closeChat);
    $('chatClearBtn').addEventListener('click', () => {
      if (chat.controller) chat.controller.abort();
      chat.messages = [];
      saveChatHistory();
      renderChat();
    });
    $('chatContextClear').addEventListener('click', () => { chat.job = null; renderChat(); });

    $('chatForm').addEventListener('submit', (e) => {
      e.preventDefault();
      if (chat.controller) { chat.controller.abort(); return; }
      const input = $('chatInput');
      const text = input.value;
      if (!text.trim() && !chat.pending.length) return;
      const images = chat.pending;
      input.value = '';
      chat.pending = [];
      renderChatPreviews();
      autosizeChatInput();
      sendChat(text, images);
    });

    /* ---------- 发图片：按钮选图 / 粘贴截图 / 拖进聊天窗口 ---------- */

    function loadImageFile(file) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('这张图片读不出来')); };
        img.src = url;
      });
    }

    /** 按像素总量压缩：长截图保留足够的宽度，文字才认得清 */
    function shrinkImage(img, maxPixels, maxSide, quality) {
      const w = img.naturalWidth;
      const h = img.naturalHeight;
      const s = Math.min(1, Math.sqrt(maxPixels / (w * h)), maxSide / Math.max(w, h));
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(w * s));
      canvas.height = Math.max(1, Math.round(h * s));
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      return canvas.toDataURL('image/jpeg', quality);
    }

    async function addChatImages(files) {
      for (const file of files) {
        if (!file.type.startsWith('image/')) continue;
        if (chat.pending.length >= CHAT_MAX_IMAGES) { toast(`一次最多发 ${CHAT_MAX_IMAGES} 张图`, true); break; }
        try {
          const img = await loadImageFile(file);
          chat.pending.push({ full: shrinkImage(img, 3000000, 4096, 0.85), thumb: shrinkImage(img, 120000, 400, 0.7) });
        } catch (e) {
          toast(e.message, true);
        }
      }
      renderChatPreviews();
      $('chatInput').focus();
    }

    function renderChatPreviews() {
      const box = $('chatPreviews');
      box.classList.toggle('show', chat.pending.length > 0);
      box.innerHTML = chat.pending.map((p, i) =>
        `<div class="chat-preview"><img src="${p.thumb}" alt=""><button type="button" data-remove="${i}" title="移除">×</button></div>`
      ).join('');
    }

    $('chatPreviews').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-remove]');
      if (!btn) return;
      chat.pending.splice(Number(btn.dataset.remove), 1);
      renderChatPreviews();
    });
    $('chatAttachBtn').addEventListener('click', () => $('chatFile').click());
    $('chatFile').addEventListener('change', (e) => {
      addChatImages([...e.target.files]);
      e.target.value = '';
    });
    $('chatInput').addEventListener('paste', (e) => {
      const files = [...((e.clipboardData && e.clipboardData.files) || [])].filter((f) => f.type.startsWith('image/'));
      if (files.length) { e.preventDefault(); addChatImages(files); }
    });
    $('chatPanel').addEventListener('dragover', (e) => {
      if ([...((e.dataTransfer && e.dataTransfer.items) || [])].some((it) => it.kind === 'file')) {
        e.preventDefault();
        $('chatPanel').classList.add('dragover');
      }
    });
    $('chatPanel').addEventListener('dragleave', (e) => {
      if (!$('chatPanel').contains(e.relatedTarget)) $('chatPanel').classList.remove('dragover');
    });
    $('chatPanel').addEventListener('drop', (e) => {
      e.preventDefault();
      $('chatPanel').classList.remove('dragover');
      const files = [...((e.dataTransfer && e.dataTransfer.files) || [])].filter((f) => f.type.startsWith('image/'));
      if (files.length) addChatImages(files);
      else toast('只能拖图片进来', true);
    });
    $('chatInput').addEventListener('input', autosizeChatInput);
    $('chatInput').addEventListener('keydown', (e) => {
      // Enter 发送；Shift+Enter 换行；输入法组字过程中不触发
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        $('chatForm').requestSubmit();
      }
    });
    $('chatSuggestions').addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (btn) sendChat(btn.textContent);
    });
    $('chatMessages').addEventListener('click', async (e) => {
      const idx = e.target.dataset.copy;
      if (idx === undefined) return;
      try {
        await navigator.clipboard.writeText(chat.messages[Number(idx)].content);
        toast('已复制');
      } catch (err) {
        toast('复制失败，请手动选择文本', true);
      }
    });

    // 首次加载
    setView(state.view, false);
    refreshAll();
  </script>
</body>
</html>
